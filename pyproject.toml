[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wb-api-tools"
version = "0.2.1"
description = "World Bank Open Data helpers — Python library + CLI mirroring the Stata wbopendata surface (discovery, data, country-context, multilingual, linewrap)."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [{ name = "Joao Pedro Azevedo" }]
keywords = ["world-bank", "wbopendata", "development", "open-data", "indicators"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests",
    "pandas",
    "pyyaml",
    "jsonschema",
    "gitpython",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "requests-mock",
]
# Extras for regenerating the README's Quick-start figures + notebook.
# Not pulled in by `pip install wb-api-tools` (these are dev/docs tooling).
examples = [
    "matplotlib",
    "scipy",           # logistic 4PL fit in example 3 (curve_fit)
    "nbformat",        # notebook builder
    "jupyter",         # `python -m jupyter nbconvert ...`
    "nbconvert",
]

[project.urls]
Homepage = "https://github.com/jpazvd/wb-api-repo"
Repository = "https://github.com/jpazvd/wb-api-repo"
Changelog = "https://github.com/jpazvd/wb-api-repo/blob/main/CHANGELOG.md"
Documentation = "https://github.com/jpazvd/wb-api-repo/blob/main/docs/PYTHON_USER_GUIDE.md"
Issues = "https://github.com/jpazvd/wb-api-repo/issues"

[project.scripts]
wb-api-tools = "wb_api_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wb_api_tools"]
# wb_api_tools/_resources/{config_update.yaml,schema_yaml_v2.json} ride
# along automatically (hatchling includes non-Python files inside the
# package dir by default); no explicit include list needed.

[tool.hatch.build.targets.sdist]
include = [
    "src/wb_api_tools",
    "README.md",
    "LICENSE.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
