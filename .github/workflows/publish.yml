name: publish

# Build + publish `wb-api-tools` to PyPI on every `v*` tag push.
#
# Authentication: PyPI trusted publisher (OIDC) — no API token. The
# matching pending publisher was registered on PyPI with:
#   PyPI Project Name: wb-api-tools
#   Owner:             jpazvd
#   Repository name:   wb-api-repo
#   Workflow name:     publish.yml      (this file)
#   Environment name:  pypi             (matches the `environment:` below)
#
# Pre-release versions (v0.2.0-rc1, v0.2.0a1, etc.) are first-class — pip
# only installs them with --pre, so they're a safe dry-run on real PyPI.

on:
  push:
    tags:
      - 'v*'
  # workflow_dispatch is kept for re-running a failed tag-triggered run
  # from the Actions UI. The `publish` job is gated below so a manual
  # run from a branch (no tag context) builds but does NOT publish.
  workflow_dispatch: {}

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build backend
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Sanity-check the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import wb_api_tools; print('installed:', wb_api_tools.__version__)"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    # Only run on tag pushes (covers both push:tags and tag-context
    # workflow_dispatch). A manual run from a branch builds the wheel
    # but skips publish — protects against accidental publishes from
    # the Actions UI.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Job-level `permissions` resets all unlisted scopes to `none`,
      # so we have to explicitly grant `actions: read` for the artifact
      # download. `contents: read` is also needed for any git-ref ops.
      id-token: write    # OIDC token for trusted publishing
      contents: read
      actions: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Verify tag matches built distribution version
        # Refuses to publish if the wheel's version doesn't match the
        # git tag (forgot to bump pyproject.toml before tagging?) or
        # if the version contains `.dev` (pre-release-from-an-unbumped-
        # source-tree slipped through). Either is a release-process bug.
        run: |
          set -euo pipefail
          # Extract version from the built wheel filename:
          # wb_api_tools-0.2.0rc1-py3-none-any.whl -> 0.2.0rc1
          wheel=$(ls dist/*.whl | head -1)
          wheel_version=$(python -c "import re,sys; m=re.match(r'.*?-(\d[^-]*)-', sys.argv[1]); print(m.group(1) if m else '')" "$wheel")
          # Tag minus the leading 'v', normalised the same way PEP 440 does
          # (v0.2.0-rc1 -> 0.2.0rc1, v0.2.0 -> 0.2.0).
          tag="${GITHUB_REF#refs/tags/v}"
          normalised_tag="${tag//-/}"
          echo "wheel: $wheel"
          echo "wheel_version: $wheel_version"
          echo "tag:           $tag"
          echo "normalised_tag: $normalised_tag"
          if [[ "$wheel_version" == *".dev"* ]]; then
            echo "::error::Refusing to publish a .dev version ($wheel_version). Bump pyproject.toml + wb_api_tools.__version__ before tagging."
            exit 1
          fi
          if [[ "$wheel_version" != "$normalised_tag" ]]; then
            echo "::error::Tag/version mismatch: tag '$tag' (normalised: '$normalised_tag') does not match built wheel version '$wheel_version'. Bump pyproject.toml + wb_api_tools.__version__ to match the tag before tagging."
            exit 1
          fi
          echo "OK: wheel version matches tag"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
