
name: World Bank Data Refresh
permissions:
  contents: write
on:
  schedule:
    # Semi-monthly: 1st + 15th of every month at 02:17 UTC.
    # Strictly twice-monthly, not every-14-days bi-weekly — the gap
    # between the 15th and the 1st is 14-17 days depending on month
    # length (28-31). Standard cron has no native "every other week".
    - cron: '17 2 1,15 * *'
  workflow_dispatch: {}
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: make wb-metadata
      - run: make wb-metadata-csv
      - run: make wb-metadata-keyed
      - name: Commit and push metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No metadata changes"
          else
            git commit -m "WB metadata refresh"
            git push
          fi
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run config-driven pulls
        run: |
          if [ -f config.yaml ]; then
            make wb-config
          else
            echo "No config.yaml; skipping wb-config"
          fi
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "WB data refresh"
            git push
          fi
